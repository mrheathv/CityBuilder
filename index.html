<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>CityBuilder</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: ui-monospace, "SF Mono", Consolas, monospace;
        background: #1c1c1c;
        color: #e8e8e0;
      }
      #app-root {
        display: flex;
        flex-direction: column;
        height: 100vh;
      }

      #hud {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 20px;
        padding: 8px 12px;
        border-bottom: 1px solid #444;
        font-size: 13px;
      }
      #hud .label {
        color: #888;
      }
      #hud .value {
        color: #e8e8e0;
        font-weight: bold;
      }
      .trend {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        margin-left: 4px;
      }
      .trend-text {
        font-size: 11px;
      }
      .trend-up {
        color: #7fd17f;
      }
      .trend-down {
        color: #e07b7b;
      }
      .trend-flat {
        color: #888;
      }
      .sparkline {
        vertical-align: middle;
      }
      /* On desktop these just flow inline as ordinary HUD items (unwrapped,
         so they still participate directly in #hud's flexbox); the mobile
         media query turns this into a togglable dropdown panel instead. */
      #hud-secondary-panel {
        display: contents;
      }
      #hud-menu-toggle {
        display: none;
      }

      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
        padding: 6px 12px;
        border-bottom: 1px solid #333;
      }
      .toolbar-label {
        color: #9ad;
        font-weight: bold;
        margin-right: 4px;
        font-size: 12px;
      }
      button {
        font-family: inherit;
        cursor: pointer;
        background: #2c2c2c;
        color: #e8e8e0;
        border: 1px solid #555;
        border-radius: 3px;
        padding: 3px 8px;
        font-size: 12px;
      }
      button:hover {
        background: #3d3d3d;
      }
      button.active {
        background: #3a5a86;
        border-color: #7ab0ff;
        color: #fff;
      }

      #main {
        flex: 1;
        display: flex;
        overflow: hidden;
      }
      #canvas-col {
        display: flex;
        flex-direction: column;
        overflow: auto;
        padding: 12px;
      }
      canvas {
        image-rendering: pixelated;
        cursor: crosshair;
        border: 1px solid #444;
        /* Prevents double-tap-to-zoom and pull-to-refresh gestures from
           hijacking taps on the grid; a single tap still reaches our click
           handler immediately (no synthetic-click delay). */
        touch-action: manipulation;
      }

      #legend {
        margin-top: 10px;
        font-size: 12px;
      }
      #legend .legend-title {
        color: #9ad;
        font-weight: bold;
        margin-bottom: 4px;
      }
      .legend-bar-row {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .legend-bar {
        width: 220px;
        height: 14px;
        border: 1px solid #666;
      }
      .legend-swatch {
        width: 14px;
        height: 14px;
        display: inline-block;
        margin-right: 6px;
        border: 1px solid #666;
        vertical-align: middle;
      }
      .legend-entry {
        margin-bottom: 2px;
      }

      #feedback {
        min-height: 1.6em;
        padding: 4px 2px;
        font-size: 12px;
        color: #f7c948;
      }

      #info {
        width: 380px;
        padding: 12px;
        overflow-y: auto;
        border-left: 1px solid #444;
        position: relative;
      }
      #info-content {
        white-space: pre-wrap;
        font-size: 12px;
        line-height: 1.5;
      }
      #info button {
        padding: 1px 6px;
        margin: 1px 2px 1px 0;
      }
      #info-close {
        display: none;
        position: absolute;
        top: 4px;
        right: 4px;
        /* A real touch target (Apple/Google both recommend >=44px), not just
           a snug fit around the glyph — a tiny corner X is easy to miss with
           a thumb, which is exactly what made it feel unclosable on mobile. */
        min-width: 44px;
        min-height: 44px;
        padding: 0;
        font-size: 22px;
        line-height: 1;
        align-items: center;
        justify-content: center;
        touch-action: manipulation;
      }
      #info-backdrop {
        display: none;
        /* iOS Safari only reliably dispatches click events on a plain <div>
           if it looks "clickable" via cursor: pointer — without this, tapping
           the backdrop to dismiss the sheet can silently do nothing on iOS
           even though the same code works fine everywhere else. */
        cursor: pointer;
        touch-action: manipulation;
      }
      .section-title {
        color: #9ad;
        font-weight: bold;
      }

      #game-over-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(10, 10, 10, 0.82);
        z-index: 10;
        align-items: center;
        justify-content: center;
      }
      #game-over-overlay.visible {
        display: flex;
      }
      #game-over-box {
        background: #232323;
        border: 2px solid #666;
        border-radius: 6px;
        padding: 28px 36px;
        max-width: 520px;
        text-align: center;
      }
      #game-over-title {
        font-size: 26px;
        font-weight: bold;
        margin-bottom: 12px;
      }
      #game-over-title.won {
        color: #7fd17f;
      }
      #game-over-title.lost {
        color: #e07b7b;
      }
      #game-over-reason {
        font-size: 13px;
        color: #ccc;
        margin-bottom: 18px;
        line-height: 1.5;
      }
      #game-over-stats {
        font-size: 12px;
        color: #999;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 4px 20px;
        text-align: left;
        border-top: 1px solid #444;
        padding-top: 14px;
      }
      #game-over-stats .value {
        color: #e8e8e0;
        font-weight: bold;
      }

      /*
       * Below this width, a scrolling responsive page stops feeling like a
       * game: scrolling to reach the info panel or a tile scrolls your
       * stats and tools out of view too. Below this breakpoint the app
       * becomes a fixed-viewport shell instead — nothing scrolls except
       * deliberately, inside an open drawer or sheet. Population/treasury
       * (the two things worth watching continuously) and the overlay/tool
       * switchers (the two things you tap constantly) stay permanently
       * visible and one tap away; everything else collapses behind a
       * menu toggle or a bottom sheet.
       */
      @media (max-width: 860px) {
        html,
        body {
          height: 100%;
          overflow: hidden;
        }
        #app-root {
          height: 100vh;
          height: 100dvh;
          overflow: hidden;
        }

        #hud {
          position: relative;
          flex-wrap: wrap;
          align-items: center;
          gap: 6px 14px;
          font-size: 13px;
          /* Right padding reserves room for the absolutely-positioned menu
             toggle so it never crowds out or truncates the primary stats. */
          padding: 8px 46px 8px 12px;
        }
        .hud-primary {
          /* Population/treasury (with their trend arrow + sparkline) must
             always be fully visible — never truncated. If they don't fit
             on one row at this width, they wrap onto their own line
             instead of being clipped. */
          white-space: normal;
          overflow: visible;
          max-width: 100%;
        }
        #hud-menu-toggle {
          display: inline-block;
          position: absolute;
          top: 6px;
          right: 8px;
          flex: none;
          font-size: 17px;
          padding: 4px 11px;
        }
        #hud-menu-toggle.active {
          background: #3a5a86;
          border-color: #7ab0ff;
        }
        /* Collapsed: hidden entirely. Expanded: a dropdown panel floating
           over the canvas rather than an inline block, so opening it never
           shifts the toolbars/canvas underneath. */
        #hud-secondary-panel {
          display: none;
        }
        #hud-secondary-panel.open {
          display: flex;
          flex-direction: column;
          align-items: flex-start;
          gap: 8px;
          position: absolute;
          top: 100%;
          right: 8px;
          background: #232323;
          border: 1px solid #555;
          border-radius: 6px;
          padding: 10px 12px;
          z-index: 6;
          box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
        }

        /* Overlay/tool switching stays exactly one tap away, no drawer —
           just a compact, horizontally-scrollable single row instead of
           wrapping across several vertical rows and pushing the canvas
           down. */
        .toolbar {
          flex-wrap: nowrap;
          overflow-x: auto;
          -webkit-overflow-scrolling: touch;
        }
        .toolbar button,
        .toolbar-label {
          flex: none;
        }

        #main {
          flex-direction: column;
          overflow: hidden;
          min-height: 0;
        }
        #canvas-col {
          flex: 1;
          min-height: 0;
          overflow: hidden;
          padding: 8px;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          position: relative;
        }
        canvas {
          max-width: 100%;
          max-height: 100%;
          width: auto;
          height: auto;
          aspect-ratio: 1 / 1;
          display: block;
        }
        #feedback {
          position: absolute;
          top: 8px;
          left: 8px;
          right: 8px;
          min-height: 0;
          background: rgba(20, 20, 20, 0.9);
          border-radius: 4px;
          padding: 6px 8px;
          pointer-events: none;
        }
        #feedback:empty {
          display: none;
        }
        #legend {
          flex: none;
          margin-top: 6px;
        }

        /* The info panel becomes a bottom sheet over the canvas instead of
           a block you scroll down to reach — it never moves your stats or
           tools out of view, and closing it just puts you back where you
           were. */
        #info {
          position: fixed;
          left: 0;
          right: 0;
          bottom: 0;
          width: auto;
          max-height: 60vh;
          border-left: none;
          border-top: 2px solid #555;
          border-radius: 12px 12px 0 0;
          transform: translateY(100%);
          transition: transform 0.2s ease-out;
          z-index: 7;
          box-shadow: 0 -4px 16px rgba(0, 0, 0, 0.5);
        }
        #info.open {
          transform: translateY(0);
        }
        #info-close {
          display: flex;
        }
        #info-content {
          padding-right: 20px;
        }

        /* Standard bottom-sheet pattern: tapping anywhere outside the sheet
           dismisses it too, so closing it doesn't depend on precisely
           hitting a small button in the corner. */
        #info.open ~ #info-backdrop {
          display: block;
          position: fixed;
          inset: 0;
          z-index: 6;
          background: rgba(0, 0, 0, 0.35);
        }

        /* Touch targets bigger than a mouse needs, and legible without a pinch-zoom. */
        button {
          padding: 7px 11px;
          font-size: 13px;
        }
        .legend-bar {
          width: 140px;
        }
      }
    </style>
  </head>
  <body>
    <div id="game-over-overlay">
      <div id="game-over-box">
        <div id="game-over-title"></div>
        <div id="game-over-reason"></div>
        <div id="game-over-stats"></div>
      </div>
    </div>
    <div id="app-root">
      <div id="hud">
        <span class="hud-primary">
          <span class="label">Population</span> <span class="value" id="hud-population">0</span>
          <span class="label">/ goal</span> <span class="value" id="hud-population-goal">0</span>
          <span class="trend" id="hud-population-trend"></span>
        </span>
        <span class="hud-primary">
          <span class="label">Treasury</span> <span class="value" id="hud-treasury">$0</span>
          <span class="trend" id="hud-treasury-trend"></span>
        </span>
        <button id="hud-menu-toggle" aria-label="More stats and controls">&#9776;</button>
        <div id="hud-secondary-panel">
          <span><span class="label">Tick</span> <span class="value" id="hud-tick">0</span></span>
          <span>
            <span class="label">Tax rate</span> <span class="value" id="hud-tax">0%</span>
            <button id="tax-down">-5%</button><button id="tax-up">+5%</button>
          </span>
          <span><span class="label">Overlay</span> <span class="value" id="hud-overlay">-</span></span>
          <span><span class="label">Tool</span> <span class="value" id="hud-tool">-</span></span>
          <span id="speed-controls">
            <span class="label">Speed</span> <span class="value" id="hud-speed">-</span>
            <button data-speed="0">Pause</button>
            <button data-speed="1">1x</button>
            <button data-speed="2">2x</button>
            <button data-speed="4">4x</button>
            <button id="step">Step</button>
          </span>
        </div>
      </div>

      <div class="toolbar" id="overlay-toolbar">
        <span class="toolbar-label">Overlay [1-6]</span>
        <button data-overlay="landValue">1 Land value</button>
        <button data-overlay="occupancy">2 Population</button>
        <button data-overlay="congestion">3 Congestion</button>
        <button data-overlay="landUse">4 Land use</button>
        <button data-overlay="density">5 Density</button>
        <button data-overlay="roads">6 Roads</button>
      </div>

      <div class="toolbar" id="tool-toolbar">
        <span class="toolbar-label">Tool</span>
        <button data-tool="inspect">Inspect</button>
        <button data-tool="buildRoad">Build Road</button>
        <button data-tool="removeRoad">Remove Road</button>
        <button data-tool="zoneResidential">Zone Residential</button>
        <button data-tool="zoneCommercial">Zone Commercial</button>
        <button data-tool="buildJobCenter">Build Job Center</button>
        <button data-tool="removeJobCenter">Remove Job Center</button>
        <button data-tool="unzone">Unzone</button>
        <button data-tool="buildAmenity">Build Park</button>
        <button data-tool="removeAmenity">Remove Park</button>
      </div>

      <div id="main">
        <div id="canvas-col">
          <canvas id="app"></canvas>
          <div id="feedback"></div>
          <div id="legend"></div>
        </div>
        <div id="info">
          <button id="info-close" aria-label="Close">&times;</button>
          <div id="info-content">Click a tile to inspect it.</div>
        </div>
        <div id="info-backdrop"></div>
      </div>
    </div>
    <script type="module" src="/src/render/main.ts"></script>
  </body>
</html>
